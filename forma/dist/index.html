<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Form" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Your personal training, nutrition and body weight journal."
    />
    <title>Form · Training journal</title>
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg
      class="launch-screen"
      aria-hidden="true"
      focusable="false"
      width="0"
      height="0"
    >
      <defs>
        <mask
          id="launch-cutout"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="100%"
          height="100%"
        >
          <rect width="100%" height="100%" fill="white" />
          <svg x="50%" y="50%" width="1" height="1" overflow="visible">
            <path
              class="launch-mark"
              fill="black"
              d="M-17-47H43L39-31H-4L-10-8H26L22 8H-14L-24 47H-42Z"
            />
          </svg>
        </mask>
      </defs>
      <rect class="launch-ink" width="100%" height="100%" fill="#f4f4f3" />
      <rect
        width="100%"
        height="100%"
        fill="black"
        mask="url(#launch-cutout)"
      />
    </svg>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app-navigation">
      <a class="brand" href="#workouts" aria-label="Form workouts"
        ><span class="app-symbol" aria-hidden="true">F</span>Form</a
      >
      <nav id="nav" aria-label="Main navigation"></nav>
    </div>
    <main id="main" tabindex="-1">
      <p class="loading">Opening your journal…</p>
    </main>
    <div id="dialogs"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
