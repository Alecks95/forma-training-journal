    <style>
      :root {
        --status-bar-height: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        margin: 0;
        background: #fff;
        color: #19191b;
        color-scheme: only light;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Paint behind the system icons before the app stylesheet arrives. */
      html::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: var(--status-bar-height);
        background: #fff;
        pointer-events: none;
        z-index: 11;
      }
      /* Paint the page white before the first styled frame. */
      html:has(#app-styles[media="print"]) body > * {
        visibility: hidden;
      }
    </style>
